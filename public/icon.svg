<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="512" height="512" rx="128" fill="#0F0A00"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B41E"/>
      <stop offset="100%" stop-color="#EB4233"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Abstract flame/brain loops -->
  <g filter="url(#glow)">
    <!-- Right/Top Teardrop -->
    <path d="M 256 128 C 340 128 400 188 400 272 C 400 356 340 400 256 400 C 200 400 256 320 256 256 C 256 192 200 128 256 128 Z" fill="url(#flameGradient)" opacity="0.9"/>
    
    <!-- Left/Bottom Teardrop -->
    <path d="M 256 384 C 172 384 112 324 112 240 C 112 156 172 112 256 112 C 312 112 256 192 256 256 C 256 320 312 384 256 384 Z" fill="url(#flameGradient)" opacity="0.95" style="mix-blend-mode: screen;"/>
  </g>
</svg>

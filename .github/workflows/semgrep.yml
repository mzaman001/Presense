# Semgrep SAST, no semgrep.dev account (decision OBS-02, Aug 13, 2026).
#
# Until 2026-10-08 this used returntocorp/semgrep-action (Semgrep 1.36 from
# 2022), which scanned with no ruleset: every analysis had 0 rules and the
# job passed anyway (audit slice 6). The scan now names its ruleset and the
# step below fails if a scan ever runs without rules again.

name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "36 12 * * 6"

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read # upload-sarif reads the run status
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Findings go to the Security tab, not a failing check (as before).
      - name: Scan
        run: semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif

      - name: Fail if no rules ran
        run: |
          python3 - <<'EOF'
          import json, sys
          run = json.load(open("semgrep.sarif"))["runs"][0]
          rules = run["tool"]["driver"].get("rules", [])
          print(f"{len(rules)} rules, {len(run.get('results', []))} results")
          sys.exit(0 if rules else 1)
          EOF

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
        if: always()

# A version is proposed only once it's 7 days old: a hijacked release is
# usually caught and pulled within days.
#
# Weekly update PRs, so a patched release (like Next.js 16.3.8 in audit
# slice 6) arrives without anyone having to look. Minor and patch updates
# come as one grouped PR; majors one at a time.
#
# Lockfiles here must be written with legacy-peer-deps off (CLAUDE.md);
# Dependabot doesn't read the user's ~/.npmrc, so its lockfiles are fine,
# and ci's `npm ci` checks them anyway.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Vitest and its plugins must share a major version: coverage-v8 5
      # alone failed npm ci against vitest 4 (#103).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types for the Node we run (22, package.json engines), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet (#102).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
